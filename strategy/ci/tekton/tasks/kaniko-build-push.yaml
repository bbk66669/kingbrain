apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: kaniko-build-push
  namespace: tekton-pipelines
spec:
  params:
    - name: IMAGE
      type: string
    - name: CONTEXT
      type: string
      default: orchestrator
    - name: DOCKERFILE
      type: string
      default: orchestrator/Dockerfile
  workspaces:
    - name: source
  results:
    - name: IMAGE_DIGEST
      description: "Pushed image digest (e.g. sha256:xxxx)"
    - name: IMAGE_URL
      description: "Pushed image URL (repository[:tag])"
  volumes:
    - name: docker-config
      secret:
        secretName: ghcr-creds
        items:
          - key: .dockerconfigjson
            path: config.json
  steps:
    - name: build-and-push
      image: gcr.io/kaniko-project/executor:latest
      workingDir: $(workspaces.source.path)
      args:
        - --destination=$(params.IMAGE)
        - --context=$(workspaces.source.path)/$(params.CONTEXT)
        - --dockerfile=$(workspaces.source.path)/$(params.DOCKERFILE)
        - --digest-file=$(results.IMAGE_DIGEST.path)
        - --snapshot-mode=time
        - --use-new-run
        - --verbosity=info
      volumeMounts:
        - name: docker-config
          mountPath: /kaniko/.docker
    - name: write-image-url
      image: alpine:3.20
      script: |
        #!/bin/sh
        set -eu
        printf '%s' '$(params.IMAGE)' > "$(results.IMAGE_URL.path)"
        test -s "$(results.IMAGE_URL.path)"
    - name: verify-results
      image: alpine:3.20
      script: |
        #!/bin/sh
        set -eu
        ls -l /tekton/results || true
        echo "IMAGE_DIGEST=$(cat $(results.IMAGE_DIGEST.path) || true)"
        echo "IMAGE_URL=$(cat $(results.IMAGE_URL.path) || true)"
        test -s "$(results.IMAGE_DIGEST.path)"
        test -s "$(results.IMAGE_URL.path)"
