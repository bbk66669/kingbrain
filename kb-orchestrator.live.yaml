apiVersion: apps/v1
kind: Deployment
metadata:
  name: kb-orchestrator
  namespace: orchestrator
  labels:
    app: kb-orchestrator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kb-orchestrator
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  template:
    metadata:
      labels:
        app: kb-orchestrator
        kb-signed: "true"                # 触发 Kyverno 门控
    spec:
      serviceAccountName: kb-runner
      imagePullSecrets:
        - name: ghcr-pull                # 从 GHCR 拉镜像
      containers:
        - name: api
          image: ghcr.io/bbk66669/kingbrain/orchestrator@sha256:86296f14cbe84af42869eafe76285180b63812b8656d6c6502c5922c8ab58338
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              protocol: TCP
          env:
            - name: KB_MODE
              value: "AUTO"
            - name: REPO_ROOT
              value: "/workspace"
          envFrom:
            - secretRef:
                name: llm-credentials
            - secretRef:
                name: anthropic-credentials
          volumeMounts:
            - name: repo
              mountPath: /workspace
              readOnly: false
      volumes:
        - name: repo
          hostPath:
            path: /srv/kingbrain
            type: DirectoryOrCreate
