apiVersion: apps/v1
kind: Deployment
metadata:
  name: kb-composer-worker
  namespace: orchestrator
  labels:
    app: kb-composer-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kb-composer-worker
  template:
    metadata:
      labels:
        app: kb-composer-worker
    spec:
      serviceAccountName: kb-runner
      terminationGracePeriodSeconds: 10
      containers:
        - name: worker
          image: ghcr.io/bbk66669/kingbrain/orchestrator@sha256:0122b9bfbfa1988c7ff85300950f169f584032690fe448789acdfb65525a1860
          imagePullPolicy: IfNotPresent
          workingDir: /app
          command: ["python", "-m", "services.composer.temporal_worker"]
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PYTHONPATH
              value: "/app:/workspace"
            - name: REPO_ROOT
              value: "/workspace"
            - name: KB_TEMPORAL_ADDR
              value: "temporal-frontend.orchestrator.svc.cluster.local:7233"
            - name: KB_TEMPORAL_NAMESPACE
              value: "default"
            - name: KB_TASK_QUEUE
              value: "kb-composer"
            - name: KB_COMPOSER_MODE
              value: "AUTO"
            # —— 关闭沙箱，立即生效 ——
            - name: TEMPORAL_WORKER_DISABLE_WORKFLOW_SANDBOX
              value: "1"
            # LLM 凭据（可选）
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: llm-keys
                  key: OPENAI_API_KEY
                  optional: true
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: llm-keys
                  key: ANTHROPIC_API_KEY
                  optional: true

            # ====== 可选：审计远端投递开关（不开启就不生效） ======
            # NATS（CloudEvents over NATS）
            - name: KB_AUDIT_ENABLE_NATS
              value: "0"                 # 需要时改成 "1"
            - name: KB_AUDIT_NATS_URL
              value: "nats://nats:4222"  # 按你的集群服务名调整
            - name: KB_AUDIT_NATS_SUBJECT_PREFIX
              value: "kb.audit."

            # Neo4j（事件写入图）
            - name: KB_AUDIT_ENABLE_NEO4J
              value: "0"                 # 需要时改成 "1"
            - name: KB_AUDIT_NEO4J_URI
              value: "bolt://neo4j.neo4j.svc.cluster.local:7687"
            - name: KB_AUDIT_NEO4J_USER
              valueFrom:
                secretKeyRef:
                  name: neo4j-auth
                  key: username
                  optional: true
            - name: KB_AUDIT_NEO4J_PASS
              valueFrom:
                secretKeyRef:
                  name: neo4j-auth
                  key: password
                  optional: true
          volumeMounts:
            - name: repo
              mountPath: /workspace
      volumes:
        - name: repo
          hostPath:
            path: /srv/kingbrain
            type: Directory
