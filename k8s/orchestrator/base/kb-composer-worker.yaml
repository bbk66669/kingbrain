apiVersion: apps/v1
kind: Deployment
metadata:
  name: kb-composer-worker
  namespace: orchestrator
  labels:
    app: kb-composer-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kb-composer-worker
  template:
    metadata:
      labels:
        app: kb-composer-worker
    spec:
      serviceAccountName: kb-runner
      terminationGracePeriodSeconds: 10
      containers:
        - name: worker
          # 基线用 tag（例如 :main）；实际在 overlays/real 里被 patch 成 digest
          image: ghcr.io/bbk66669/kingbrain/orchestrator:main
          imagePullPolicy: IfNotPresent
          workingDir: /app
          command: ["python", "-m", "services.composer.temporal_worker"]
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PYTHONPATH          # 兜底确保能 import 到 /app 下的 services/*
              value: /app:/workspace
            - name: REPO_ROOT
              value: /workspace
            - name: KB_TEMPORAL_ADDR
              value: temporal-frontend.orchestrator.svc.cluster.local:7233
            - name: KB_TEMPORAL_NAMESPACE
              value: default
            - name: KB_TASK_QUEUE
              value: kb-composer
            - name: KB_COMPOSER_MODE
              value: "AUTO"
            # LLM 凭据（可选，有就用）
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: llm-keys
                  key: OPENAI_API_KEY
                  optional: true
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: llm-keys
                  key: ANTHROPIC_API_KEY
                  optional: true
          volumeMounts:
            - name: repo
              mountPath: /workspace
      volumes:
        - name: repo
          hostPath:
            path: /srv/kingbrain
            type: Directory
