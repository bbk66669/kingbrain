apiVersion: apps/v1
kind: Deployment
metadata:
  name: kb-composer-worker
  namespace: orchestrator
  labels:
    app: kb-composer-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kb-composer-worker
  template:
    metadata:
      labels:
        app: kb-composer-worker
    spec:
      serviceAccountName: kb-runner
      terminationGracePeriodSeconds: 10
      containers:
        - name: worker
          image: ghcr.io/bbk66669/kingbrain/orchestrator@sha256:0122b9bfbfa1988c7ff85300950f169f584032690fe448789acdfb65525a1860
          imagePullPolicy: IfNotPresent
          workingDir: /app
          command: ["python", "-m", "services.composer.temporal_worker"]
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PYTHONPATH
              value: "/app:/workspace"
            - name: REPO_ROOT
              value: "/workspace"
            - name: KB_TEMPORAL_ADDR
              value: "temporal-frontend.orchestrator.svc.cluster.local:7233"
            - name: KB_TEMPORAL_NAMESPACE
              value: "default"
            - name: KB_TASK_QUEUE
              value: "kb-composer"
            - name: KB_COMPOSER_MODE
              value: "AUTO"
            # —— 关闭沙箱，立即生效 ——
            - name: TEMPORAL_WORKER_DISABLE_WORKFLOW_SANDBOX
              value: "1"
            # LLM 凭据（可选）
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: llm-keys
                  key: OPENAI_API_KEY
                  optional: true
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: llm-keys
                  key: ANTHROPIC_API_KEY
                  optional: true
          volumeMounts:
            - name: repo
              mountPath: /workspace
      volumes:
        - name: repo
          hostPath:
            path: /srv/kingbrain
            type: Directory
