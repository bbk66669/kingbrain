# 使用 o3 作为主模型 + 编辑模型
model: openai/o3-2025-04-16
editor-model: openai/o3-2025-04-16

# 使用 Claude 3.5 Haiku 作为弱模型（用于 repo map / 摘要 / 搜索）
weak-model: anthropic/claude-3-5-haiku-20241022

# 自动生成最小 diff 的提交
auto-commits: true
dirty-commits: false

# 写明确的提交说明（自测/回滚）
commit-prompt: |
  写清：变更目的、修改文件、如何自测（make/curl/kubectl）、如何回滚（rollout undo 或 git revert）。
  严格最小化 diff，禁止无关格式化/重排。
