# /.collab/paths.allowlist.yaml
# --------------------------------------------
# 只允许 AI 写入 / 修改以下路径；其他路径视为只读
allow:
  - "/apps/**"
  - "/services/**"
  - "/scripts/**"
  - "/ml/**"
  - "/observability/**"
  - "/orchestrator/**"
  - "/strategy/ci/**"
  - "/.collab/**"
  - "/docs/**"
  - "/reports/**"
  - "/data/**"                # ✅ 新增：顶层允许，但默认只读（见 readonly / writable）

deny:
  - "/.git/**"
  - "/configs/registry/**"        # 受控
  - "/preference/models/**"       # 需双签
  - "/security/**"                # 准入策略
  - "/k8s/manifests/**"           # 生产集群清单
  - "/terraform/**"

# 允许 AI 协作阶段可写路径
# 其余路径默认 deny，由 Tekton Gate 强制
readonly:
  - "/k8s/manifests/**/*.yaml"      # 所有 YAML 可读不可写
  - "/docs/kingbrain/**"
  - "/grafana/dashboards/**/*.json"
  - "/data/**"                      # ✅ 新增：/data 默认只读

writable:
  - "/docs/kingbrain/ACK/**"
  - "/docs/kingbrain/PLAN/**"
  - "/docs/kingbrain/BORROW/**"
  - "/docs/kingbrain/DIFF/**"
  - "/reports/**"
  - "/data/sbom/**"                 # ✅ 新增：证据包 SBOM 输出（与 kb-validate 对齐）
  - "/data/lineage/**"              # ✅ 新增：lineage 校验输入/输出

# 若后续需屏蔽生成物，可再追加：
# deny:
#   - "/k8s/manifests/generated/**"
# --------------------------------------------
