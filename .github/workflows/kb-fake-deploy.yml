name: kb-fake-deploy
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, kb]
    steps:
      - uses: actions/checkout@v4

      - name: Setup kubeconfig
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        shell: bash
        run: |
          mkdir -p "$HOME/.kube"
          echo "$KUBECONFIG_B64" | base64 -d > "$HOME/.kube/config"
          kubectl version --client=true

      - name: Preflight
        run: make kb-preflight

      - name: Deploy (FAKE)
        run: make kb-deploy K8S_OVERLAY=k8s/orchestrator/overlays/fake

      - name: Wait rollout
        run: |
          kubectl -n orchestrator rollout status deploy/kb-orchestrator --timeout=180s
          kubectl -n orchestrator get pods -o wide

      - name: Contracts
        run: make kb-contracts

      - name: Smoke
        run: make kb-smoke

      - name: On failure: diag
        if: ${{ failure() }}
        run: make kb-diag
